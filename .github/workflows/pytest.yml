name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # The integration tests import the real gateway SessionStore/SessionEntry
  # and bind the real /new reset funnel (GatewaySessionCommandsMixin).
  # Pinned to the v0.23.3 release (caafe538), which moves the gateway session
  # DB onto the storage interface (persistence_assembly.open_persistence): the
  # suite must exercise that layout, so a reset path that reaches for private
  # session storage is caught against the tree that actually has it.
  # Re-ran the full suite locally (82 passed on CPython 3.12 and 3.14) against
  # a clean v0.23.3 worktree before moving the pin.
  HERMES_REF: caafe5389ae585ef77387a962aee05b1bcf17029

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fetch pinned Hermes tree
        # tests/test_session_reset_policy.py resolves the tree at
        # ~/.hermes/hermes-agent; tests skip (not fail) if it is absent.
        # actions/checkout fetches WITH the workflow token — the previous
        # anonymous `git clone` kept hitting GitHub's unauthenticated rate
        # limit (HTTP 429) and failing whole runs on this step.
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent-src
          fetch-depth: 1

      - name: Place Hermes tree at ~/.hermes/hermes-agent
        run: |
          mkdir -p ~/.hermes
          mv "$GITHUB_WORKSPACE/hermes-agent-src" ~/.hermes/hermes-agent

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # Deliberately no PYTHONPATH for the plugin checkout itself: the
        # standalone-suite discipline is that collection must work without
        # Hermes imports. The hermes tree enters sys.path lazily inside the
        # real-store tests only.
        run: python -m pytest tests/ -q
